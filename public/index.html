<!DOCTYPE html>

    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />

    <title>Henry Fernández — Senior Fullstack Engineer &amp; Software Architect</title>

    <meta property="og:url" content="https://henryjfv.github.io/CV/" />
    <meta
      property="og:title"
      content="Henry Fernández — Senior Fullstack Engineer &amp; Software Architect"
    />
    <meta
      property="og:description"
      content="Senior fullstack engineer and software architect. I build reporting platforms, data pipelines and legacy integrations for teams whose tools stopped scaling."
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Henry Fernández — Senior Fullstack Engineer and Software Architect"
    />

        "address": {
          "@type": "PostalAddress",

  <body>
    <div id="app"></div>
    <!-- Rendered when scripts are unavailable, and readable by crawlers that
         do not run JavaScript. Mirrors the headline content of the app. -->
    <noscript>
      <main style="max-width: 48rem; margin: 0 auto; padding: 2rem 1.25rem; font-family: system-ui, sans-serif; line-height: 1.6;">
        <h1>Henry José Fernández Villarreal</h1>
        <p><strong>Senior Fullstack Engineer &amp; Software Architect</strong> — Colombia · Remote — Open to contract work</p>
        <p>
          I build systems for companies whose tools outgrew them: legacy ERPs with no API,
          reporting stacks that stopped scaling, manual processes that should have been
          pipelines. Working in software since 2016, I sit on the line between product
          engineering and data infrastructure — Django and FastAPI services, PostgreSQL and
          Airflow pipelines, Angular and Flutter front ends.
        </p>
        <h2>Experience</h2>
        <ul>
          <li><strong>Senior Fullstack Engineer &amp; Software Architect</strong>, 2023 – Present — multi-tenant reporting platform (Django, PostgreSQL, Redis, Airflow, Angular); invoice automation over a legacy ERP; data quality pipelines for the financial sector; retrieval-augmented conversational assistant.</li>
          <li><strong>Full Stack Developer</strong>, Indra — Mar 2022 – Mar 2023</li>
          <li><strong>Full Stack Developer</strong>, Opensols — Aug 2018 – Mar 2022</li>
          <li><strong>Android Developer</strong>, Cloud Technology Center — Apr 2016 – Jan 2018</li>
        </ul>
        <h2>Skills</h2>
        <p>TypeScript, Python, JavaScript, Java, Dart, SQL · FastAPI, Django, Node.js, Pydantic, SQLAlchemy · Angular, React, Vue, Flutter · PostgreSQL, SQL Server, Airflow, Redis, Power BI · AWS, Azure, Docker, GitHub Actions</p>
        <h2>Links</h2>
        <p>
          <a href="https://www.linkedin.com/in/henryjosefernandez-villarreal/">LinkedIn</a> ·
          <a href="https://github.com/henryjfv">GitHub</a>
        </p>
      </main>
    </noscript>
    <!-- built files will be auto injected -->
